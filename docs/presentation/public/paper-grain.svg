<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.114  0 0 0 0 0.106  0 0 0 0 0.094  0 0 0 0.55 0" />
    </filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.114  0 0 0 0 0.106  0 0 0 0 0.094  0 0 0 0.55 0" />
    </filter>
  </defs>
  <rect width="400" height="400" filter="url(#grain)" opacity="0.05" />
  <rect width="400" height="400" filter="url(#mottle)" opacity="0.03" />
</svg>
