# Log collector, one pod per node. Output goes to stdout (see `kubectl logs ds/fluent-bit`);
# a production setup would ship to Loki or OpenSearch and keep a tail `db` offset file.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  labels:
    app.kubernetes.io/name: fluent-bit
    app.kubernetes.io/component: logging
spec:
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fluent-bit
        app.kubernetes.io/component: logging
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          args: [--config=/fluent-bit/config/fluent-bit.yaml]
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/config
            - name: varlog
              mountPath: /var/log
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 64Mi
          # Root is required: container log files under /var/log/pods are root-owned and mode 0640.
          # Everything else is locked down: no capabilities, read-only root and /var/log.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: fluent-bit-config
        - name: varlog
          hostPath:
            path: /var/log
