name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      # Bun runs the tools' bin scripts (vitest, tsc, knip, ...) with Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Unit and integration tests; the integration setup starts a throwaway
      # PostgreSQL container with the Docker CLI.
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Upload the frontend build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: apps/web/dist/
          if-no-files-found: error
          # The artifact is a zip archive. Level 9 compresses most, which suits
          # the HTML, JavaScript and CSS.
          compression-level: 9

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
          docker compose ps
      - run: bunx playwright install --with-deps chromium
      # Both target the stack on http://localhost:8080.
      - run: bun run test:e2e
      - run: bun run test:lighthouse
      - name: Show service logs
        if: always()
        run: docker compose logs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            test-results/
            .lighthouseci/
          # .lighthouseci/ is a dot-directory, which is skipped by default.
          include-hidden-files: true
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # Deploys deploy/k8s to a throwaway kind cluster and runs the API and report
  # tests through the web Service. On Kubernetes the API starts each report as
  # a Job through the Kubernetes API, so this job tests the RBAC and the Job
  # template that the compose-e2e job never touches.
  k8s-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          cluster_name: venue-booking
      - name: Build the images and load them into kind
        run: |
          # The manifests pull no images: both must already be on the node,
          # tagged with the one newTag that kustomization.yaml sets.
          tag=$(awk '/newTag:/ {print $2}' deploy/k8s/kustomization.yaml | sort -u)
          if [ "$(echo "$tag" | wc -l)" -ne 1 ]; then
            echo "The images in kustomization.yaml have different newTag values: $tag"
            exit 1
          fi
          cp .env.example .env
          IMAGE_TAG=$tag docker compose build api frontend
          kind load docker-image --name venue-booking venue-booking/api:$tag venue-booking/frontend:$tag
      - name: Deploy
        run: |
          cp deploy/k8s/secret.env.example deploy/k8s/secret.env
          kubectl apply -k deploy/k8s
          kubectl -n venue-booking rollout status deploy/api deploy/web sts/postgres ds/fluent-bit --timeout=5m
      - run: bunx playwright install --with-deps chromium
      - name: Run the API and report tests
        run: |
          kubectl -n venue-booking port-forward svc/web 8080:8080 > port-forward.log 2>&1 &
          timeout 60 sh -c 'until curl -fs http://localhost:8080/api/health > /dev/null; do sleep 1; done'
          bun run test:e2e tests/e2e/api.spec.ts tests/e2e/reports.spec.ts
      # The report test passes with REPORT_RUNNER=inline too, so check that a
      # Job really ran. Scheduled Jobs from the CronJob have no report-id label.
      - name: Check that the report ran as a Job
        run: kubectl -n venue-booking wait job -l venue-booking/report-id --for=condition=Complete --timeout=2m
      - name: Show cluster state
        if: failure()
        run: |
          kubectl -n venue-booking get all,pvc,events -o wide
          kubectl -n venue-booking describe pods
          kubectl -n venue-booking logs -l app.kubernetes.io/part-of=venue-booking --all-containers --prefix --tail=100 --max-log-requests=20
          cat port-forward.log
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: k8s-e2e-reports
          path: test-results/

  # The report PDF tool is a uv project; lint, format and type-check it. No
  # browser is needed for these checks.
  md-to-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/md-to-pdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  # The one check for branch protection to require: it passes only when every
  # job above succeeded. always() makes it report even when one of them failed.
  quality-gate:
    if: always()
    needs: [lint, test, build, compose-e2e, k8s-e2e, md-to-pdf]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
