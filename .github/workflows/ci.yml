name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # Bun runs the tools' bin scripts (vitest, tsc, knip, ...) with Node.js.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run knip
      - run: bun run typecheck
      # Unit and integration tests; the integration setup starts a throwaway
      # PostgreSQL container with the Docker CLI.
      - run: bun run test
      - run: bun run build

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up --build -d --wait
          docker compose ps
      - run: bunx playwright install --with-deps chromium
      # Both target the stack on http://localhost:8080.
      - run: bun run test:e2e
      - run: bun run test:lighthouse
      - name: Show service logs
        if: always()
        run: docker compose logs
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          path: |
            test-results/
            .lighthouseci/
          # .lighthouseci/ is a dot-directory, which is skipped by default.
          include-hidden-files: true
      - name: Stop the stack
        if: always()
        run: docker compose down -v
