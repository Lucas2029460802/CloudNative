name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so new CodeQL queries also check code that has not changed.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload results to code scanning.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Both are interpreted, so CodeQL needs no build. "actions" scans the workflows.
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The default queries plus lower-precision and lower-severity security queries.
          queries: security-extended
          # Vendored agent skills; Oxlint, Oxfmt and Knip skip them too.
          config: |
            paths-ignore:
              - .agents
              - .claude
              - .codex
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
