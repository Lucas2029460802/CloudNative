[project]
name = "md-to-pdf"
version = "0.1.0"
description = "Print Markdown lab reports to A4 PDFs with Playwright's Chromium"
readme = "README.md"
authors = [{ name = "eric15342335", email = "eric310@connect.hku.hk" }]
requires-python = ">=3.15"
dependencies = ["markdown-it-py>=4.3.0", "playwright>=1.65.2"]

[project.scripts]
md-to-pdf = "md_to_pdf.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.1", "ruff>=0.17.5"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", # docstrings: no blank line before the class docstring (D211)
  "D213", # docstrings: summary on the first line (D212)
  "COM812", # conflicts with the formatter
  "CPY001", # no per-file copyright headers in this repo
]

[tool.mypy]
strict = true
files = ["src"]
